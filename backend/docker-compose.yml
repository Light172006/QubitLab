version: '3.8'
services:
  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      - QUBITLAB_DATABASE_URL=postgresql+asyncpg://qubitlab:qubitlab@db:5432/qubitlab
      - QUBITLAB_REDIS_URL=redis://redis:6379/0
      - QUBITLAB_SECRET_KEY=change-this-in-production
      - QUBITLAB_GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: qubitlab
      POSTGRES_PASSWORD: qubitlab
      POSTGRES_DB: qubitlab
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  pgdata:
