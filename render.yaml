services:
  # Backend FastAPI API service
  - type: web
    name: qubitlab-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: QUBITLAB_DATABASE_URL
        fromDatabase:
          name: qubitlab-db
          property: connectionString
      - key: QUBITLAB_SECRET_KEY
        generateValue: true
      - key: QUBITLAB_CORS_ORIGINS
        value: '["*"]'
      - key: QUBITLAB_GEMINI_API_KEY
        sync: false
      - key: QUBITLAB_GEMINI_MODEL
        value: gemini-2.5-flash

  # Frontend React/Vite SPA static site
  - type: web
    name: qubitlab-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://qubitlab-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: qubitlab-db
    databaseName: qubitlab
    user: qubitlab
    plan: free
